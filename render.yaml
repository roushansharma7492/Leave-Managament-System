services:
  - type: web_service
    name: employee-leave-management-backend
    env: java
    plan: free
    region: oregon
    buildCommand: cd backend && mvn clean -B -DskipTests package
    startCommand: java -jar backend/target/employee-leave-management-1.0.0.jar
    healthCheckPath: /api/health
    healthCheckTimeout: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: employee-leave-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: employee-leave-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: employee-leave-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: ALLOWED_ORIGINS
        value: https://employee-leave-frontend.vercel.app
      - key: JWT_SECRET
        value: your-super-secret-jwt-key-change-in-render-dashboard
      - key: PORT
        value: 8080

databases:
  - name: employee-leave-db
    databaseName: employee_leave_db
    user: leave_user
    plan: free
    region: oregon
    ipAllowList: []
