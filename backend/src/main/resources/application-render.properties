# Render Production Configuration
spring.application.name=employee-leave-management
server.port=${PORT:8080}

# MySQL Database Configuration (For Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# CORS Configuration
spring.mvc.cors.allowed-origins=${ALLOWED_ORIGINS}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.max-age=3600
spring.mvc.cors.allow-credentials=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.leavemgmt=INFO
logging.level.org.springframework.web=INFO

# Server Configuration
server.servlet.context-path=/
server.error.include-message=always

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
